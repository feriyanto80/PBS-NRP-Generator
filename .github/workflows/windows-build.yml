name: PBS NRP Generator - Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract v1.0.3 cumulative source
        shell: pwsh
        run: |
          tar -xJf PBS_NRP_Source_v1.0.3.tar.xz
          if (!(Test-Path app.py)) { throw "Source archive missing app.py" }
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate source
        run: python -m py_compile app.py
      - name: Build portable EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PBS_NRP_Generator app.py
      - name: Verify EXE output
        shell: pwsh
        run: |
          if (!(Test-Path dist/PBS_NRP_Generator.exe)) { throw "EXE artifact missing" }
          Write-Host "EXE bytes: $((Get-Item dist/PBS_NRP_Generator.exe).Length)"
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PBS_NRP_Generator_Windows_x64_v1.0.3
          path: dist/PBS_NRP_Generator.exe
          if-no-files-found: error
