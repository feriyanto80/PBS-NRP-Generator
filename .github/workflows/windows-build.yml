name: PBS NRP Generator - Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract cumulative v1.0.3 baseline
        shell: pwsh
        run: |
          tar -xJf PBS_NRP_Source_v1.0.3.tar.xz
          if (!(Test-Path app.py)) { throw "Baseline archive missing app.py" }
          if (!(Test-Path launcher.py)) { throw "Dual-format launcher missing" }
          if (!(Test-Path osm_acquisition.py)) { throw "OSM recovery engine missing" }
          if (!(Test-Path engineering_render.py)) { throw "Engineering drawing renderer missing" }
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile app.py kml_support.py osm_acquisition.py launcher.py test_osm.py test_wrapper.py engineering_render.py test_engineering.py
      - name: Regression tests KML/KMZ and OSM recovery
        run: python -m unittest -v test_wrapper test_osm test_engineering
      - name: Build PBS NRP Generator v1.0.6 EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PBS_NRP_Generator launcher.py
      - name: Verify Windows executable
        shell: pwsh
        run: |
          if (!(Test-Path dist/PBS_NRP_Generator.exe)) { throw "EXE artifact missing" }
          $head = [System.IO.File]::ReadAllBytes("dist/PBS_NRP_Generator.exe")
          if ($head.Length -lt 1000000 -or $head[0] -ne 77 -or $head[1] -ne 90) { throw "Invalid EXE format" }
          Write-Host "EXE bytes: $($head.Length)"
      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PBS_NRP_Generator_Windows_x64_v1.0.6_Engineering_Offset_Footprints
          path: dist/PBS_NRP_Generator.exe
          if-no-files-found: error
