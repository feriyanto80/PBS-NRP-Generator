name: PBS NRP Generator - Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract original v1.0.3 application engine
        shell: pwsh
        run: |
          tar -xJf PBS_NRP_Source_v1.0.3.tar.xz
          if (!(Test-Path app.py)) { throw "Base app.py missing" }
          foreach ($name in @("launcher.py","building_sources.py","drafter_titleblock.py","engineering_render.py","road_topology.py","kml_support.py","osm_acquisition.py","google_auto.py","responsive_ui.py","footprint_classify.py","adaptive_sheets.py","google_stream.py","drawing_settings.py","dwg_provider.py","dwg_ui.py","cad_sheet_layout.py","reference_cad_profile.py","reference_pdf_layout.py","starlite_logo.py","pbs_identity.py","pbs_login_gate.py","original_frame.py","template_symbols.py","exact_template.py","reference_pdf_glyphs.py","drafter_annotations.py","original_dxf_blocks.py","reference_basemap.py","reference_sheets.py")) {
            if (!(Test-Path $name)) { throw "Required source missing: $name" }
          }
      - name: Upload diagnostic Python source (no client templates)
        uses: actions/upload-artifact@v4
        with:
          name: PBS_NRP_Source_Diagnostics_v1022
          path: |
            *.py
            requirements.txt
          if-no-files-found: error
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "shapely>=2.0,<3" pypdf "pymupdf>=1.24"
      - name: Validate Python syntax
        run: python -m py_compile app.py launcher.py kml_support.py osm_acquisition.py engineering_render.py building_sources.py drafter_titleblock.py road_topology.py test_wrapper.py test_osm.py test_engineering.py test_buildings.py test_junctions.py google_auto.py responsive_ui.py footprint_classify.py test_responsive.py test_gui_smoke.py test_footprint_audit.py adaptive_sheets.py test_adaptive_sheets.py google_stream.py test_google_stream.py drawing_settings.py test_ui_controls.py dwg_provider.py dwg_ui.py test_dwg_provider.py cad_sheet_layout.py test_cad_sheets.py reference_cad_profile.py reference_pdf_layout.py test_reference_dxf2018.py reference_demo.py starlite_logo.py pbs_identity.py pbs_login_gate.py test_identity_and_logo.py template_symbols.py exact_template.py original_frame.py reference_pdf_glyphs.py drafter_annotations.py original_dxf_blocks.py reference_basemap.py reference_sheets.py test_reference_source_v1021.py test_exact_titleblock_v1022.py test_exact_template.py test_reference_pdf_glyphs.py test_drafter_v1020.py
      - name: Run regression suite
        run: python -m unittest -v test_wrapper test_osm test_engineering test_buildings test_junctions test_responsive test_footprint_audit test_adaptive_sheets test_google_stream test_ui_controls test_dwg_provider test_cad_sheets test_reference_dxf2018 test_identity_and_logo test_exact_template test_reference_pdf_glyphs test_drafter_v1020 test_reference_source_v1021 test_lemahabang_precon_v1022 test_exact_titleblock_v1022
      - name: Windows interactive-widget smoke test
        run: python -m unittest -v test_gui_smoke test_adaptive_sheets
      - name: Generate offline A3 reference PDF and DXF
        run: python reference_demo.py
      - name: Upload A3 reference PDF and DXF sample
        uses: actions/upload-artifact@v4
        with:
          name: PBS_NRP_v1.0.22_Full_Exact_Lemahabang_Titleblock_Demo
          path: reference_demo_output/*
          if-no-files-found: error
      - name: Build portable Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PBS_NRP_Generator responsive_ui.py
      - name: Validate executable
        shell: pwsh
        run: |
          $exe = "dist/PBS_NRP_Generator.exe"
          if (!(Test-Path $exe)) { throw "EXE missing" }
          $bytes=[System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 1000000 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw "Invalid PE executable" }
          Write-Host "PE EXE build complete: $($bytes.Length) bytes"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PBS_NRP_Generator_Win64_v1.0.22_ExactCAD_5Sheet_FullFrame
          path: dist/PBS_NRP_Generator.exe
          if-no-files-found: error
